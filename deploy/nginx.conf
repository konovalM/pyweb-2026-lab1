# Пример nginx-конфига для статики MkDocs на сервере Selectel.
# Ключевой момент (п.11 задания): use_directory_urls: true отдаёт красивые
# ссылки /research/rul-vibration/ — для них нужен try_files, иначе каталог
# без index.html вернёт 403/404. На GitHub Pages это делается автоматически,
# на своём nginx — вручную.

server {
    listen 80;
    server_name research.example.ru;        # заменить на свой домен/IP

    root /var/www/ps-research;               # = SELECTEL_PATH из workflow
    index index.html;

    # Красивые URL каталогов: сначала файл, затем каталог/index.html, затем 404.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Долгий кэш для статических ассетов (графики, css, js, шрифты).
    location ~* \.(png|svg|jpg|jpeg|gif|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Своя страница 404 от MkDocs Material.
    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
